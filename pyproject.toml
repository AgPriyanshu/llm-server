[tool.ruff]
line-length = 88
target-version = "py311"  # or your Python version

# Enable recommended rules
select = ["E", "F", "I"] 
ignore = []

# Enable Ruff formatter (Black-compatible)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
