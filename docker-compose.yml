# docker-compose.yml for LLM Server + vLLM + Qdrant

version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    volumes:
      - ./:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # depends_on:
    # vllm:
    #   condition: service_healthy
    # qdrant:
    #   condition: service_healthy

  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      # WSL2 compatibility - disable v1 engine which has Triton compilation issues
      - VLLM_USE_V1=0
    volumes:
      - ./data/models:/root/.cache/huggingface
    command: [
        "--model",
        "Qwen/Qwen2.5-1.5B-Instruct",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--max-model-len",
        "8192",
        "--gpu-memory-utilization",
        "0.9",
        # WSL2 compatibility - disable CUDA graphs and torch compile
        "--enforce-eager",
      ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 10
    #   start_period: 120s

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
# Notes:
# - Set HF_TOKEN environment variable if using gated models
# - Models are cached in ./data/models for persistence
# - vLLM health check has long start_period (120s) for model loading
# - For production, remove --reload flag from web service
# - Run with: docker-compose up -d
